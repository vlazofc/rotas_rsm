# ============================================================
# Rotas Brasil — Docker Compose
#
# Links locais:
# - Sistema:       http://localhost:8089
# - API docs:      http://localhost:8001/docs
# - API health:    http://localhost:8001/health
# - MinIO console: http://localhost:9003
#
# VPS com Cloudflare Tunnel:
# - docker compose --profile cloudflare up -d --build
#
# Nome do projeto/stack (é o que painéis como o da Hostinger mostram na lista
# de projetos): controlado só aqui, em "name:". Trocar isso não renomeia
# containers já criados — veja docs/deploy-rebranding.md para o passo a passo
# de recriar a stack no servidor com o novo nome.
# ============================================================

name: admmendes-rotas

services:
  # --- Túnel Cloudflare: única porta de entrada pública ---
  cloudflared:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    container_name: rotas_cloudflared
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN_ROTAS}
    depends_on:
      - proxy
    # O hostname público deste túnel foi configurado no painel para
    # http://localhost:8089. A rede do host faz esse endereço alcançar o Caddy.
    network_mode: host

  # --- Proxy interno (roteia / -> web e /api -> api) ---
  proxy:
    image: caddy:2
    container_name: rotas_proxy
    restart: unless-stopped
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8089:80"  # loopback por padrão; servidor LAN pode definir 0.0.0.0
    depends_on:
      - web
      - api
    networks:
      - internal

  # --- Frontend (build estático servido por nginx) ---
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: rotas_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./map-tiles:/usr/share/nginx/html/tiles:ro
    networks:
      - internal

  # --- API FastAPI ---
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: rotas_api
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --workers ${API_WORKERS:-4}
      --bind 0.0.0.0:8000
      --keep-alive 10
      --timeout 120
      --graceful-timeout 30
      --max-requests 5000
      --max-requests-jitter 500
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - internal

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    profiles: ["maintenance"]
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: python -c "from app.services.bootstrap import init_db; init_db()"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # --- Worker Celery genérico (notificações, cálculos) ---
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: rotas_worker
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      disable: true
    depends_on:
      - postgres
      - redis
    networks:
      - internal

  # --- Scheduler (Celery beat) ---
  scheduler:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: rotas_scheduler
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: celery -A app.workers.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    depends_on:
      - postgres
      - redis
    networks:
      - internal

  # --- PostgreSQL + PostGIS ---
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rotas_postgres
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: rotas_redis
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - internal

  # --- MinIO ---
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: rotas_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    networks:
      - internal

  # --- Backup diário do PostgreSQL ---
  backup:
    image: postgres:16-alpine
    container_name: rotas_backup
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - ./backups:/backups
      - ./scripts/backup_postgres.sh:/backup_postgres.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup_postgres.sh; sleep 86400; done"]
    depends_on:
      - postgres
    networks:
      - internal

  minio-backup:
    image: quay.io/minio/mc:latest
    container_name: rotas_minio_backup
    profiles: ["maintenance"]
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - ./backups:/backups
      - ./scripts/backup_minio.sh:/backup_minio.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup_minio.sh; sleep 86400; done"]
    depends_on:
      - minio
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  # Nomes fixos (não seguem o nome do projeto/stack): assim, trocar "name:"
  # acima nunca troca de volume por baixo nem arrisca perder dados existentes.
  postgres_data:
    name: admmendes_postgres_data
  redis_data:
    name: admmendes_redis_data
  minio_data:
    name: admmendes_minio_data
  caddy_data:
    name: admmendes_caddy_data
  caddy_config:
    name: admmendes_caddy_config
