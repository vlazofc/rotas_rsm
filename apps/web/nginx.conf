server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota cai no index.html. O HTML não deve ficar preso em cache,
    # porque ele aponta para o bundle JS atual.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # cache de assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Tiles locais do mapa. Monte ou copie os arquivos em /usr/share/nginx/html/tiles/{z}/{x}/{y}.png.
    location /tiles/ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
